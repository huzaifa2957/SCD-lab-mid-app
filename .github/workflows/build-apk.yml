name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk StudentNest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StudentNest-apk
          path: StudentNest.apk

      # A release gives a direct download link that opens on a phone without a GitHub login.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StudentNest build ${{ github.run_number }}
          body: Install StudentNest.apk on your Android phone (allow "Install unknown apps" when asked).
          files: StudentNest.apk
          make_latest: true
